<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theme swatches</title>
<style>
  html, body { margin: 0; background: #0a0a0f; color: #e8e8f0; font-family: -apple-system, system-ui, sans-serif; }
  body { padding: 22px; }
  .lbl { font-size: 0.7rem; color: #8888a0; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; }
  .sw {
    flex: 1; aspect-ratio: 1; border-radius: 12px; border: 2px solid #2a2a3a;
    display: flex; align-items: flex-end; justify-content: center; padding: 4px;
    position: relative; overflow: hidden;
  }
  .sw.active { border-color: #4f8cff; }
  .sw.active::after { content: ""; position: absolute; top: 4px; right: 4px; width: 14px; height: 14px; border-radius: 50%; background: #4f8cff; border: 2px solid var(--bgc); }
  .name {
    font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;
    background: rgba(0,0,0,0.55); color: #fff; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .sw.light .name { background: rgba(255,255,255,0.7); color: #18181b; }
</style>
</head>
<body>
  <div class="lbl">Theme</div>
  <div class="row">
    <div class="sw active" style="--bgc:#0a0a0f;background:linear-gradient(135deg,#0a0a0f 50%,#16161f 50%)"><div class="name">Dark</div></div>
    <div class="sw" style="background:linear-gradient(135deg,#060912 50%,#0d1424 50%)"><div class="name">Midnight</div></div>
    <div class="sw" style="background:linear-gradient(135deg,#061410 50%,#0e1f17 50%)"><div class="name">Forest</div></div>
    <div class="sw" style="background:linear-gradient(135deg,#000 50%,#1a1a1a 50%)"><div class="name">High Contrast</div></div>
    <div class="sw light" style="background:linear-gradient(135deg,#fafaf7 50%,#f0f0ed 50%)"><div class="name">Light</div></div>
  </div>
</body>
</html>
