<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theme accents</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { height: 100%; margin: 0; background: #0a0a0f; }
  body { padding: 18px 22px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .card { border-radius: 12px; padding: 14px; border: 1px solid; aspect-ratio: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
  .accent-row { display: flex; gap: 6px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; }
  .hex { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; opacity: 0.7; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card" style="background:#0a0a0f;border-color:#2a2a3a;color:#e8e8f0">
      <div class="name">Dark</div>
      <div><div class="dot" style="background:#4f8cff"></div><div class="hex">#4f8cff</div></div>
    </div>
    <div class="card" style="background:#060912;border-color:#1d2a47;color:#e0eaff">
      <div class="name">Midnight</div>
      <div><div class="dot" style="background:#22d3ee"></div><div class="hex">#22d3ee</div></div>
    </div>
    <div class="card" style="background:#061410;border-color:#1f3b2c;color:#e8f5e9">
      <div class="name">Forest</div>
      <div><div class="dot" style="background:#a3e635"></div><div class="hex">#a3e635</div></div>
    </div>
    <div class="card" style="background:#000;border-color:#ffffff66;color:#fff">
      <div class="name">High Contrast</div>
      <div><div class="dot" style="background:#fde047"></div><div class="hex">#fde047</div></div>
    </div>
    <div class="card" style="background:#fafaf7;border-color:#d4d4d0;color:#18181b">
      <div class="name">Light</div>
      <div><div class="dot" style="background:#2563eb"></div><div class="hex">#2563eb</div></div>
    </div>
  </div>
</body>
</html>
