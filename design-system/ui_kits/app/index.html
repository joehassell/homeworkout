<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<title>SimpleWorkoutGen — UI kit</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { background: #07070a; }
  .stage {
    width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .device {
    width: 390px; height: 780px;
    border-radius: 36px; overflow: hidden;
    background: var(--bg); position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 8px #1a1a22, 0 0 0 9px #2a2a3a;
  }
  .device .screen, .device .timer-screen { height: 100%; padding-top: 50px; }
  .device .timer-screen { padding-top: 50px; }
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px 0; font-size: 0.85rem; font-weight: 600; color: var(--text);
    z-index: 100; pointer-events: none;
  }
  .status-bar .right { display: flex; gap: 5px; align-items: center; }
  .notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 110px; height: 30px; background: #000; border-radius: 999px; z-index: 99; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="SetupScreen.jsx"></script>
<script type="text/babel" src="PreviewScreen.jsx"></script>
<script type="text/babel" src="TimerScreen.jsx"></script>
<script type="text/babel" src="DoneScreen.jsx"></script>
<script type="text/babel" src="HistoryScreen.jsx"></script>
<script type="text/babel" src="SettingsScreen.jsx"></script>
<script type="text/babel" src="BottomNav.jsx"></script>

<script type="text/babel">
const { useState } = React;

function buildWorkout(config) {
  // Cosmetic; numbers tuned to feel right.
  const main = config.type === "strength"
    ? [
        { num: 1, name: "Goblet Squat", duration: "8 reps", equipment: "dumbbell" },
        { num: 2, name: "Bench Press",  duration: "6 reps", equipment: "barbell" },
        { num: 3, name: "Bent Row",     duration: "8 reps", equipment: "dumbbell" },
        { num: 4, name: "Romanian Deadlift", duration: "6 reps", equipment: "barbell" },
      ]
    : config.type === "hiit"
    ? [
        { num: 1, name: "Burpees",      duration: "40s", equipment: "bodyweight" },
        { num: 2, name: "Kettlebell Swing", duration: "40s", equipment: "kettlebell" },
        { num: 3, name: "Mountain Climber", duration: "40s", equipment: "bodyweight" },
        { num: 4, name: "Jump Squat",   duration: "40s", equipment: "bodyweight" },
      ]
    : config.type === "conditioning"
    ? [
        { num: 1, name: "Skipping",     duration: "60s", equipment: "rope" },
        { num: 2, name: "Push-up",      duration: "12 reps", equipment: "bodyweight" },
        { num: 3, name: "Sit-up",       duration: "15 reps", equipment: "mat" },
        { num: 4, name: "Lunges",       duration: "10/side", equipment: "bodyweight" },
      ]
    : [
        { num: 1, name: "Turkish Get-up", duration: "3/side", equipment: "kettlebell" },
        { num: 2, name: "Single-leg RDL", duration: "8/side", equipment: "dumbbell" },
        { num: 3, name: "Farmer Carry",   duration: "30s", equipment: "dumbbell" },
        { num: 4, name: "Plank",          duration: "45s", equipment: "mat" },
      ];

  return {
    sections: [
      { label: "Warm-up", rest: "~ 4 min", badge: "warmup", badgeLabel: "Warm-up",
        items: [
          { num: "W1", name: "Arm circles",     duration: "30s", equipment: "bodyweight" },
          { num: "W2", name: "Bodyweight squat", duration: "10 reps", equipment: "bodyweight" },
          { num: "W3", name: "Hip opener",       duration: "30s", equipment: "bodyweight" },
        ]},
      { label: "Main · " + config.sets + " " + (config.sets === 1 ? "set" : "sets"),
        rest: config.intensity === "high" ? "180s rest" : config.intensity === "moderate" ? "90s rest" : "60s rest",
        badge: "main", badgeLabel: "Main", items: main },
      { label: "Cooldown", rest: "5 min", badge: "cooldown", badgeLabel: "Cooldown",
        items: [
          { num: "C1", name: "Child's pose",   duration: "60s", equipment: "mat" },
          { num: "C2", name: "Pigeon stretch", duration: "60s/side", equipment: "mat" },
        ]},
    ]
  };
}

function StatusBar() {
  return (
    <>
      <div className="notch" />
      <div className="status-bar">
        <span>9:41</span>
        <div className="right">
          <span style={{fontSize: "0.7rem"}}>●●●●</span>
          <svg width="16" height="11" viewBox="0 0 16 11"><path d="M1 9.5C2 7 5 4 8 4s6 3 7 5.5" stroke="currentColor" fill="none" strokeWidth="1.5" strokeLinecap="round"/><circle cx="8" cy="9" r="1" fill="currentColor"/></svg>
          <svg width="22" height="11" viewBox="0 0 22 11"><rect x="0.5" y="0.5" width="18" height="10" rx="2.5" stroke="currentColor" fill="none"/><rect x="2" y="2" width="13" height="7" rx="1" fill="currentColor"/><rect x="19" y="3.5" width="2" height="4" rx="1" fill="currentColor"/></svg>
        </div>
      </div>
    </>
  );
}

function App() {
  const [tab, setTab] = useState("build");
  const [view, setView] = useState("setup"); // setup | preview | timer | done
  const [config, setConfig] = useState({
    type: "hiit", duration: 30, intensity: "moderate", sets: 3,
    focus: { Pull: "increase", Core: "increase", "Full body": "exclude" }
  });
  const [workout, setWorkout] = useState(null);

  const handleGenerate = () => { setWorkout(buildWorkout(config)); setView("preview"); };

  let body;
  if (tab !== "build") {
    body = tab === "history" ? <HistoryScreen /> : <SettingsScreen />;
  } else if (view === "setup") {
    body = <SetupScreen config={config} setConfig={setConfig} onGenerate={handleGenerate} />;
  } else if (view === "preview") {
    body = <PreviewScreen config={config} workout={workout} onBack={() => setView("setup")} onStart={() => setView("timer")} />;
  } else if (view === "timer") {
    body = <TimerScreen workout={workout} onDone={() => setView("done")} onBack={() => setView("done")} />;
  } else {
    body = <DoneScreen config={config} onAgain={() => { setView("setup"); setTab("build"); }} />;
  }

  return (
    <div className="stage">
      <div className="device">
        <StatusBar />
        {body}
        <BottomNav tab={tab} onTab={(t) => { setTab(t); if (t === "build") setView("setup"); }} hidden={view === "timer"} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
